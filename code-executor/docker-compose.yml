version: '3.8'

services:

 # Микросервис выполнения кода
  code-executor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    # Ограничения ресурсов для безопасности
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    # Настройки безопасности
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 